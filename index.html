<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jeff — Coffee & Aesthetic</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* 定義主題顏色變數 */
            --starbucks-green: #1e3932;
            --cream-white: #f5f3ef;
            --dark-text: #2c3e2f;
            --light-grey: #dcdcd4;
            --shadow-color: rgba(0,0,0,0.08);
        }

        body {
            margin: 0;
            /* 使用引入的 Noto Sans TC */
            font-family: "Noto Sans TC", sans-serif; 
            background-color: var(--cream-white);
            color: var(--dark-text);
            /* 讓滾動更平滑 */
            scroll-behavior: smooth;
        }

        /* 頂部導覽列 */
        header {
            background-color: var(--starbucks-green);
            padding: 18px;
            color: white;
            text-align: center;
            font-size: 22px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* 大頭貼 Hero 區域 */
        .hero {
            text-align: center;
            padding: 60px 20px 40px 20px;
        }

        .hero img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid var(--starbucks-green);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); /* 陰影加深一點，強調大頭貼 */
        }

        .hero h1 {
            margin-top: 22px;
            color: var(--starbucks-green);
            font-size: 32px;
            letter-spacing: 1px;
        }

        .hero p {
            font-size: 18px;
            color: #444;
            margin-top: 6px;
        }

        /* 分隔線 */
        .divider {
            width: 70%;
            height: 2px;
            background-color: var(--starbucks-green);
            margin: 40px auto;
            opacity: 0.15; /* 稍微降低透明度，更柔和 */
        }

        /* 區塊標題 */
        h2 {
            font-size: 26px;
            color: var(--starbucks-green);
            margin-bottom: 12px;
            font-weight: 600;
            border-bottom: 2px solid var(--light-grey); /* 增加底部線條，更具結構感 */
            padding-bottom: 8px;
        }

        /* 每個內容卡片 */
        .section {
            width: 88%;
            max-width: 780px;
            margin: auto;
            background: #ffffff;
            padding: 28px;
            margin-bottom: 40px;
            border-radius: 16px;
            box-shadow: 0 6px 15px var(--shadow-color); /* 陰影稍微加大 */
            transition: transform 0.3s ease, box-shadow 0.3s ease; /* 🌟 優化 3: 增加過渡動畫 */
        }
        .section:hover {
            transform: translateY(-3px); /* 輕微上浮效果 */
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        p {
            font-size: 17px;
            line-height: 1.7;
            color: #333;
        }

        /* 列表樣式 */
        ul {
            padding-left: 20px;
            margin-top: 20px;
        }

        ul li {
            margin: 10px 0;
            font-size: 17px;
            color: #333;
            list-style: none; /* 移除預設點點 */
            position: relative;
            padding-left: 20px;
        }
        ul li::before {
            content: "☕"; /* 🌟 優化 3: 使用咖啡 emoji 作為列表標記 */
            position: absolute;
            left: 0;
            color: var(--starbucks-green);
        }

        /* 技能 */
        .skill-bar {
            margin: 12px 0 20px 0;
        }
        .skill-title {
            font-weight: 600;
            margin-bottom: 6px;
        }
        .bar {
            height: 12px; /* 技能條稍微加高 */
            background: var(--light-grey);
            border-radius: 20px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: var(--starbucks-green);
            border-radius: 20px 0 0 20px;
            transition: width 1s ease-out; /* 增加載入動畫感 */
        }

        /* 拉花作品集 */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            grid-gap: 18px;
